name: NutriFacts
options:
  bundleIdPrefix: com.justingarcia
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
targets:
  NutriFacts:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/NutriFacts.xcconfig
      Release: Config/NutriFacts.xcconfig
    sources:
      - path: NutriFacts
        excludes: [Info.plist]
      # The repo's data files are the source of truth; bundle them directly.
      - path: ../data/health-score.json
        buildPhase: resources
    settings:
      base:
        # Registered under team XDWKSAH7W3 with the Private Cloud Compute and HealthKit capabilities.
        PRODUCT_BUNDLE_IDENTIFIER: com.justingarcia.NutrifactsJP
        DEVELOPMENT_TEAM: XDWKSAH7W3
        CODE_SIGN_ENTITLEMENTS: NutriFacts/NutriFacts.entitlements
        PRODUCT_NAME: NutriFacts
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: NutriFacts/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: NutriFacts
        # Compiles Assets.xcassets/AppIcon and sets CFBundleIconName; App Store uploads fail without it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: NutriFacts uses the camera to read nutrition labels. Text is recognised on your iPhone.
        # Write only: "Add to Apple Health" on a result. NutriFacts never reads Health data.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: NutriFacts adds the foods you choose to Health, with the nutrition from their label.
        INFOPLIST_KEY_NSHealthShareUsageDescription: NutriFacts doesn't read your Health data. It only adds foods you choose.
        CODE_SIGN_STYLE: Automatic
  NutriFactsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NutriFactsTests
    dependencies:
      - target: NutriFacts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justingarcia.NutrifactsJPTests
        DEVELOPMENT_TEAM: XDWKSAH7W3
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NutriFacts:
    build:
      targets:
        NutriFacts: all
        NutriFactsTests: [test]
    test:
      targets:
        - NutriFactsTests
